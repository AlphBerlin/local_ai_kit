<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="LocalAI Kit — pluggable, offline-first, streaming-first on-device AI toolkit for Flutter." />
  <title>LocalAI Kit</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    /* Minimal palette: neutral grays + a single teal accent. No gradients. */
    :root {
      --theme-color: #0f766e;
      --theme-color-light: #ccfbf1;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sidebar { border-right: 1px solid #e5e7eb; }
    .sidebar ul li.active > a { border-right: 3px solid #0f766e; color: #0f766e; }
    .markdown-section h1, .markdown-section h2 { border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
    .markdown-section code { color: #0f766e; }
    .markdown-section table th { background: #f3f4f6; }
  </style>
</head>
<body>
  <div id="app">Loading LocalAI Kit docs…</div>
  <script>
    window.$docsify = {
      name: 'LocalAI Kit',
      repo: 'ajithberlin/local_ai_kit',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search docs…',
        noData: 'No results.',
        depth: 4,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied',
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-dart.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
</body>
</html>
