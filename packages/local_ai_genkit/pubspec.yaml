name: local_ai_genkit
description: >-
  Optional Genkit orchestration layer for LocalAI Kit: flows, tools,
  prompt templates and schema-validated structured output on top of any
  core LocalLlm.
version: 0.0.1
repository: https://github.com/AlphBerlin/local_ai_kit
issue_tracker: https://github.com/AlphBerlin/local_ai_kit/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  local_ai_core: ^0.0.1
  # Only for the `LocalAIGenkitX` escape-hatch extension (architecture
  # §3.5). The dependency direction genkit → kit is intentional.
  local_ai_kit: ^0.0.1
  genkit: ">=0.14.1 <0.15.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
