name: local_ai_gemma
description: >-
  flutter_gemma adapter for LocalAI Kit: implements the core LocalLlm
  interface on top of Google's on-device Gemma runtime.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  local_ai_core:
  # Upgraded version for modern on-device LLMs (Qwen, DeepSeek, Gemma)
  flutter_gemma: ^1.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
