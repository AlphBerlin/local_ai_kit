name: local_ai_kit
description: >-
  LocalAI Kit facade: LocalAI.initialize wiring, facades (llm/stt/tts/voice/
  models/runtime), model download manager with resumable downloads, LRU
  runtime scheduler, voice pipeline with barge-in, typed pipeline DSL and
  config presets.
version: 0.0.1
repository: https://github.com/AlphBerlin/local_ai_kit
issue_tracker: https://github.com/AlphBerlin/local_ai_kit/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  local_ai_core: ^0.0.1
  local_ai_flutter: ^0.0.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  local_ai_sherpa: ^0.0.1

flutter:
  assets:
    - assets/catalog.json
