name: local_ai_core
description: >-
  Pure-Dart core of LocalAI Kit: capability interfaces, configuration,
  manifests, events, adapter registry and test fakes. No Flutter deps.
version: 0.0.2
repository: https://github.com/AlphBerlin/local_ai_kit
issue_tracker: https://github.com/AlphBerlin/local_ai_kit/issues
resolution: workspace

environment:
  sdk: ^3.6.0

# Hard rule (see docs-internal/architecture.md §2): only Dart SDK + meta +
# collection are allowed here. Never add flutter / flutter_gemma / genkit /
# sherpa_onnx to this package.
dependencies:
  meta: ^1.15.0
  collection: ^1.19.0

dev_dependencies:
  lints: ^5.1.1
  test: ^1.25.0
